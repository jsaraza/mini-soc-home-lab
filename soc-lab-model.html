<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="description" content="Interactive 2D and 3D model of a small home security operations lab: what is built, how a log reaches the SIEM, and which attacks are detected.">
<link rel="icon" href="data:,">
<title>Mini-SOC Home Lab</title>
<style>
:root{
  --bg:#0d1218; --stage:#10161d; --surface:#141b24; --card:#1b2431; --line:#263140; --line-2:#3d4b5d;
  --ink:#e8edf3; --ink-2:#b3bdc9; --ink-3:#8894a4;
  /* one muted accent per zone: --z-<zone id> */
  --z-lab:#7fb2df; --z-home:#d3ae6e; --z-internet:#ad9ee3; --z-other:#8894a4;
  --signal:#e7917d;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:#fff}
button{font:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mono{font-family:var(--mono);font-size:.93em}
h2{font-size:16px;font-weight:650;margin:0}
.wrap{max-width:1560px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;z-index:60}
.skip:focus{left:12px}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 48px;align-items:end;padding:30px 0 22px}
.top h1{margin:0 0 10px;font-size:clamp(24px,3.2vw,32px);line-height:1.12;font-weight:650;letter-spacing:-.015em}
.summary{margin:0;max-width:68ch;color:var(--ink-2)}
.by{margin:12px 0 0;font-size:14px;color:var(--ink-3)}
.by .own{color:var(--ink-2)}
.by a{color:var(--ink-2);margin-left:12px}
.build{border-left:1px solid var(--line);padding-left:24px;min-width:280px}
.build p{margin:0}
.build .n{font-size:15px;color:var(--ink-2)}
.build .n b{font-size:24px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.pips{display:flex;gap:4px;margin:8px 0 7px;padding:0;list-style:none}
.pip{width:24px;height:9px;border-radius:2px;border:1px dashed var(--line-2)}
.pip.s-built{border:1px solid var(--ink-2);background:var(--ink-2)}
.pip.s-in_progress{border:1px dashed var(--ink-2);box-shadow:inset 11px 0 0 var(--ink-3)}
.build .sub{font-size:13px;color:var(--ink-3)}
.build .sub span+span{margin-left:14px}
.build .upd{font-size:13px;color:var(--ink-3);margin-top:6px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 10px;align-items:center;padding:14px 0 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--surface)}
.seg button{font-size:13.5px;color:var(--ink-2);background:none;border:0;border-radius:8px;padding:6px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button[aria-disabled="true"]{color:var(--ink-3);cursor:default}
.btn{font-size:13.5px;line-height:1.3;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-disabled="true"]{color:var(--ink-3);border-style:dashed;cursor:default}
.btn[aria-disabled="true"]:hover{border-color:var(--line-2)}
.btn.ghost{background:none;border-color:var(--line)}
.btn:disabled{color:var(--ink-3);cursor:default}
.spacer{flex:1 1 auto}
.note{font-size:13px;color:var(--ink-3)}
.lock{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px}
.tag{display:inline-block;font-size:11px;font-weight:600;line-height:1;padding:3px 7px 4px;border-radius:99px;border:1px dashed var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.s-built{border:1px solid var(--ink-2);background:var(--ink-2);color:var(--bg)}
.tag.s-in_progress{border:1px dashed var(--ink-2)}
.tag.s-sim{border:1px solid var(--line-2);color:var(--ink-2)}

/* stage */
.stage{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--stage);overflow:hidden}
#v2 svg{display:block;width:100%;height:auto;margin:0 auto}
#v2.tall svg{max-width:560px}
#v3{position:relative;height:clamp(380px,70vh,780px);touch-action:none;cursor:grab;outline-offset:-4px;user-select:none;-webkit-user-select:none}
#v3.dragging{cursor:grabbing}
#v3 canvas{display:block;width:100%;height:100%}
.l3wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.l3{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none}
.n3{pointer-events:auto;cursor:pointer;display:grid;gap:1px;justify-items:start;text-align:left;font-size:12.5px;line-height:1.25;padding:5px 9px 6px;border-radius:8px;background:rgba(13,18,24,.9);border:1px dashed var(--line-2);color:var(--ink-2)}
.n3.s-built{border:1px solid var(--ac);background:rgba(27,36,49,.95)}
.n3.s-in_progress{border:1px dashed var(--ac)}
.n3 .r{display:flex;gap:8px;align-items:center}
.n3 b{font-weight:650;font-size:13px;color:var(--ink)}
.n3 .c{font-size:11.5px;color:var(--ink-3)}
.n3 .x{font-size:11.5px;font-weight:650;color:var(--bg);background:var(--signal);border-radius:99px;padding:1px 7px;margin-top:3px}
.n3.on{border-color:#fff;box-shadow:0 0 0 1px #fff}
.n3.dim{opacity:.45}
.n3.sel{box-shadow:0 0 0 2px var(--ink)}
.z3{font-size:12.5px;font-weight:650}
.f3{font:11px/1.2 var(--mono);color:var(--ink-2);background:rgba(13,18,24,.8);padding:2px 6px;border-radius:5px}
.hint{position:absolute;left:12px;bottom:10px;margin:0;font-size:12px;color:var(--ink-3);pointer-events:none}

/* walkthrough bar */
.tour{position:sticky;bottom:12px;z-index:15;margin:12px 0 0;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.thead{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--ink-2)}
.thead b{color:var(--ink);font-weight:650}
.tcount{margin-left:auto;color:var(--ink-3)}
.tcap{margin:0;font-size:15px;line-height:1.45;min-height:2.9em}
.tcap .where{font-weight:650}
.tcap .fires{display:block;color:var(--signal);font-size:13.5px;margin-top:2px}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* detections */
.dets{margin-top:26px}
.dhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:10px}
.dhead p{margin:0;font-size:13.5px;color:var(--ink-3)}
.chips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.chip{width:100%;height:100%;text-align:left;display:grid;gap:6px;align-content:start;padding:11px 12px 12px;border-radius:10px;border:1px dashed var(--line-2);background:none;color:var(--ink-2);cursor:pointer}
.chip.s-built{border:1px solid var(--ink-3);background:var(--card);color:var(--ink)}
.chip.s-in_progress{border:1px dashed var(--ink-3);background:rgba(27,36,49,.5)}
.chip:hover,.chip.on{border-color:var(--ink)}
.chip.on{box-shadow:0 0 0 1px var(--ink)}
.chip.alert{border:1px solid var(--signal);box-shadow:0 0 0 1px var(--signal);color:var(--ink)}
.chead{display:flex;align-items:center;gap:8px}
.cid{font-weight:700;font-size:14px;color:var(--ink)}
.copt{font-size:12px;color:var(--ink-3)}
.chead .tag{margin-left:auto}
.cname{font-size:14px;line-height:1.3}
.catk{font-size:12px;color:var(--ink-3)}

/* results, legend, footer */
.results{margin-top:26px}
.results dl{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 0}
.results dl>div{border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;min-width:150px}
.results dt{font-size:12.5px;color:var(--ink-3)}
.results dd{margin:2px 0 0;font-family:var(--mono);font-size:18px}
.legend{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:8px}
.sw{width:22px;height:14px;border-radius:4px;border:1.5px dotted var(--ink-3)}
.sw.s-built{border:1.5px solid var(--ink-2);background:var(--card)}
.sw.s-in_progress{border:1.5px dashed var(--ink-2)}
.lnk{width:26px;height:0;border-top:2px dotted var(--ink-3)}
.lnk.s-built{border-top:2px solid var(--ink-2)}
.xk{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--signal);border-radius:50%;color:var(--signal);font-size:9px;line-height:1}
.zd{width:10px;height:10px;border-radius:2px}
.foot{margin:26px 0 44px;color:var(--ink-3);font-size:13.5px}
.foot p{margin:0}

/* side panel (bottom sheet on phones) */
.panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100vw;z-index:30;background:var(--surface);border-left:1px solid var(--line-2);padding:22px 22px 28px;overflow:auto;overscroll-behavior:contain;box-shadow:-14px 0 34px rgba(0,0,0,.4);animation:pin .16s ease-out}
@keyframes pin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes pup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.pclose{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:none;color:var(--ink-2);cursor:pointer;font-size:17px;line-height:1}
.pclose:hover{color:#fff;border-color:var(--ink-3)}
.panel .kick{margin:0 46px 2px 0;font-size:13px;color:var(--ink-3)}
.panel h2{font-size:21px;line-height:1.2;margin:0 46px 8px 0;outline:none}
.panel h3{font-size:13.5px;font-weight:650;margin:20px 0 8px}
.panel p{margin:8px 0}
.panel .lead2{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rows li{border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start;font-size:14px;color:var(--ink-2)}
.rows li.s-built{border:1px solid var(--ink-3);background:var(--card);color:var(--ink)}
.rows li.s-in_progress{border:1px dashed var(--ink-3)}
.rows .r1{font-weight:600;color:var(--ink)}
.rows .r2{grid-column:1/-1;font-size:13px;color:var(--ink-3)}
@media (min-width:760px) and (max-width:1559px){
  .panel.left{right:auto;left:0;border-left:0;border-right:1px solid var(--line-2);box-shadow:14px 0 34px rgba(0,0,0,.4)}
}
@media (min-width:1560px){body.panel-open{padding-right:396px}.panel{box-shadow:none}}
@media (max-width:900px){
  .top{grid-template-columns:1fr}
  .build{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}
}
@media (max-width:759px){
  .wrap{padding:0 12px}
  .top{padding:20px 0 16px}
  .bar{gap:8px}
  .bar .spacer{display:none}
  .btn{padding:7px 10px}
  .tour{grid-template-columns:1fr;bottom:8px}
  .tbtns{justify-content:flex-start}
  .tcount{margin-left:0}
  #v3{height:clamp(360px,64vh,600px)}
  .n3{font-size:11.5px;padding:3px 7px 4px}
  .n3 b{font-size:12px}
  .n3 .c,.f3{display:none}
  .n3 .tag{font-size:10px;padding:2px 5px 3px}
  .panel{top:auto;left:0;right:0;width:auto;max-height:66vh;border-left:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;padding:18px 16px 26px;animation-name:pup;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  body.panel-open{padding-bottom:66vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to the diagram</a>
<div class="wrap">
  <header class="top" id="top"></header>
  <main>
    <div class="bar">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="b2d" aria-pressed="true">2D diagram</button>
        <button type="button" id="b3d" aria-pressed="false">3D model</button>
      </div>
      <span class="note" id="msg3d" role="status"></span>
      <span class="spacer"></span>
      <button type="button" class="btn" id="bEvent">Follow one event</button>
      <button type="button" class="btn" id="bInc">Incident walkthrough (simulated)</button>
      <button type="button" class="btn ghost" id="bPng">Download PNG</button>
      <button type="button" class="btn ghost" id="bSvg">Download SVG</button>
      <button type="button" class="btn ghost" id="bReset" hidden>Reset view</button>
    </div>
    <p class="lock" id="lock" role="status" hidden></p>
    <div class="stage" id="stage">
      <div id="v2"></div>
      <div id="v3" hidden tabindex="0" role="group" aria-label="3D model of the lab. Arrow keys orbit, plus and minus zoom, shift with arrow keys pans, zero resets the view. Each component is a button inside this group.">
        <canvas id="c3"></canvas>
        <div class="l3wrap" id="l3"></div>
        <p class="hint" id="hint3"></p>
      </div>
    </div>
    <div class="tour" id="tour" role="region" aria-label="Walkthrough" hidden>
      <div class="thead"><b id="tTitle"></b><span class="tag s-sim">Simulated</span><span class="tcount mono" id="tCount"></span></div>
      <p class="tcap" id="tCap" aria-live="polite"></p>
      <div class="tbtns">
        <button type="button" class="btn" id="tBack">Back</button>
        <button type="button" class="btn" id="tPlay">Pause</button>
        <button type="button" class="btn" id="tNext">Next</button>
        <button type="button" class="btn ghost" id="tClose">Close</button>
      </div>
    </div>
    <section class="dets" aria-labelledby="dh">
      <div class="dhead"><h2 id="dh">Detections</h2><p id="dsub"></p></div>
      <ul class="chips" id="chips"></ul>
    </section>
    <section class="results" id="results" aria-labelledby="rh" hidden>
      <h2 id="rh">Results</h2>
      <dl id="rl"></dl>
    </section>
    <section class="legend" id="legend" aria-label="Legend"></section>
  </main>
  <footer class="foot"><p>Lab environment. All attack activity is simulated with benign commands on my own test accounts.</p></footer>
</div>
<aside class="panel" id="panel" aria-labelledby="ph" hidden></aside>
<noscript><p style="padding:24px">This model needs JavaScript to draw the diagram.</p></noscript>

<script>
"use strict";
/* =====================================================================
   1. DATA. The single source of truth. Both views draw from this object.
      Change a status, number or link here; nothing below needs editing.
      status: "built" | "in_progress" | "planned"
   ===================================================================== */
const LAB = {
  meta: {
    title: "Mini-SOC Home Lab",
    summary: "A small security operations lab on an Active Directory domain: a firewall gateway, a SIEM collecting Windows, Sysmon and firewall logs, EDR sensors, and tested detections mapped to MITRE ATT&CK.",
    owner: "Jaime Saraza",
    github: "https://github.com/jsaraza",
    repoUrl: null,                 // project repo; hide all evidence links while null
    lastUpdated: "2026-11-14"
  },
  zones: [
    { id: "lab",      name: "Lab network",  detail: "adlab-net · 192.168.10.0/24 · VirtualBox internal network" },
    { id: "home",     name: "Home network", detail: "private, not reachable from the internet" },
    { id: "internet", name: "Internet",     detail: "" }
  ],
  nodes: [
    { id: "dc01", zone: "lab", name: "AD-DC01", category: "Domain controller",
      detail: "Windows Server 2022 · AD DS, DNS, file share", ip: "192.168.10.10", status: "built",
      agents: [ { name: "Sysmon", status: "planned" },
                { name: "Splunk Universal Forwarder", status: "planned" },
                { name: "LimaCharlie sensor", status: "planned" } ] },
    { id: "cl01", zone: "lab", name: "AD-CL01", category: "Workstation",
      detail: "Windows 10 Pro · domain-joined", ip: "192.168.10.20", status: "built",
      agents: [ { name: "Sysmon", status: "planned" },
                { name: "Splunk Universal Forwarder", status: "planned" },
                { name: "LimaCharlie sensor", status: "planned" } ] },
    { id: "fw", zone: "lab|home", name: "pfSense", category: "Firewall / gateway",
      detail: "LAN 192.168.10.1 · WAN on the home network · default deny, every block logged",
      ip: "192.168.10.1", status: "in_progress" },
    { id: "siem", zone: "home", name: "Splunk Enterprise", category: "SIEM",
      detail: "Separate laptop · indexes: wineventlog, sysmon, pfsense, lanl · web UI limited to the home network",
      status: "planned" },
    { id: "edr", zone: "internet", name: "LimaCharlie", category: "EDR (cloud console)",
      detail: "Process timelines and detection rules for both machines", status: "planned" },
    { id: "net", zone: "internet", name: "Windows Update and DNS", category: "External services",
      detail: "Patching, name resolution, licence activation", status: "planned" },
    { id: "data", zone: "home", name: "Public attack dataset", category: "Reference data",
      detail: "Los Alamos National Laboratory enterprise logs with labelled red-team activity, used to score detections",
      status: "planned" }
  ],
  flows: [
    { id: "f1", from: ["dc01","cl01"], via: "fw", to: "siem", port: "TCP 9997",
      carries: "Windows Security, System, Sysmon and PowerShell logs", status: "planned" },
    { id: "f2", from: ["fw"], to: "siem", port: "UDP 5514", carries: "Firewall logs", status: "planned" },
    { id: "f3", from: ["dc01","cl01"], via: "fw", to: "edr", port: "TCP 443", carries: "EDR telemetry", status: "planned" },
    { id: "f4", from: ["dc01"], via: "fw", to: "net", port: "443, 53", carries: "Updates, DNS, activation", status: "planned" },
    { id: "f5", from: ["dc01","cl01"], to: "fw", port: "everything else", carries: "Blocked and logged", blocked: true, status: "planned" },
    { id: "f6", from: ["data"], to: "siem", port: "one-off load", carries: "One day of authentication events", status: "planned" }
  ],
  detections: [
    { id: "D1", name: "Brute force followed by success", attack: ["T1110"], sources: ["cl01","dc01"],
      logic: "Many failed logons (4625) for one account in a short window, then a success (4624)", status: "planned", doc: null },
    { id: "D2", name: "Account lockout", attack: ["T1110"], sources: ["dc01"],
      logic: "Lockout event 4740, with the computer that caused it", status: "planned", doc: null },
    { id: "D3", name: "Privileged group change", attack: ["T1098"], sources: ["dc01"],
      logic: "A member added to Domain Admins, Enterprise Admins or Administrators (4728 / 4732 / 4756)", status: "planned", doc: null },
    { id: "D4", name: "Encoded PowerShell", attack: ["T1059.001","T1027"], sources: ["cl01","dc01"],
      logic: "A process started with -EncodedCommand (4688 / Sysmon 1); decoded content from 4104", status: "planned", doc: null },
    { id: "D5", name: "Firewall deny spike", attack: ["T1046"], sources: ["fw"],
      logic: "One internal machine blocked on many ports or hosts within minutes", status: "planned", doc: null },
    { id: "D6", name: "Configuration drift", attack: ["T1484.001"], sources: ["dc01"], optional: true,
      logic: "A Group Policy or domain policy change (5136 / 4739) outside an approved change", status: "planned", doc: null }
  ],
  incident: {
    id: "INC-001", label: "Simulated account compromise", status: "planned", doc: null,
    steps: [
      { text: "Password guessing against a test account", node: "cl01", fires: "D1" },
      { text: "Successful sign-in with the guessed password", node: "cl01", fires: "D1" },
      { text: "The account is added to Domain Admins", node: "dc01", fires: "D3" },
      { text: "Encoded PowerShell runs", node: "cl01", fires: "D4" },
      { text: "Contained: account disabled, removed from the group, password reset", node: "dc01", fires: null }
    ],
    timeToDetectMin: null, timeToContainMin: null
  },
  metrics: { recallPct: null, precisionPct: null, falsePositivesPerDayBefore: null, falsePositivesPerDayAfter: null }
};

/* =====================================================================
   2. WIRING (not content)
   ===================================================================== */
/* "Follow one event" traces this path. Every value is an id or name that
   already exists in LAB; the button stays disabled until all of it is built. */
const EVENT_PATH = { source: "cl01", agent: "Splunk Universal Forwarder", flow: "f1", detection: "D1" };

/* The only external request this page can make: Three.js, pinned, with a

  let bandB = headB + 8;

  if (gw) R.mids.forEach((f, i) => {
    const L = i === 0

      window.addEventListener("pointercancel", onUp);
    }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stopAuto();
  });
  host.addEventListener("contextmenu", e => e.preventDefault());
  host.addEventListener("wheel", e => {
    e.preventDefault();
    zoom(Math.exp((e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY) * 0.0012));
    stopAuto(); applyCam();
  }, { passive: false });
  canvas.addEventListener("pointermove", e => { if (!ptrs.size) canvas.style.cursor = pickAt(e.clientX, e.clientY) ? "pointer" : ""; });
  host.addEventListener("keydown", e => {
    const k = e.key;
    let used = true;
    if (k === "ArrowLeft" || k === "ArrowRight") { const s = k === "ArrowLeft" ? 1 : -1; if (e.shiftKey) pan(s * 40, 0); else orb.th += s * 0.12; }
    else if (k === "ArrowUp" || k === "ArrowDown") { const s = k === "ArrowUp" ? 1 : -1; if (e.shiftKey) pan(0, s * 40); else orb.ph = clamp(orb.ph - s * 0.08, 0.12, 1.5); }
    else if (k === "+" || k === "=") zoom(0.88);
    else if (k === "-" || k === "_") zoom(1.14);
    else if (k === "0" || k === "Home") resetView();
    else used = false;
    if (used) { e.preventDefault(); stopAuto(); applyCam(); }
  });

  /* highlight state shared with the 2D view */
  function applyFocus3() {
    const f = curFocus();
    for (const id of Object.keys(nodes3)) {
      const n3 = nodes3[id], on = !!f && f.nodes.has(id);
      n3.mats.forEach(m => m.color.set(on ? "#ffffff" : n3.ac));
      const b = n3.label.el;
      b.classList.toggle("on", on);
      b.classList.toggle("dim", !!f && !on);
      b.classList.toggle("sel", !!selected && selected.type === "node" && selected.id === id);
      let extra = "";
      if (f && f.alert && siem && siem.id === id) extra = f.alert + " alert";
      const ag = f ? f.agents.filter(a => a.node === id) : [];
      if (ag.length) extra = ag.map(a => a.name).join(", ");
      for (const name of Object.keys(n3.agentMats)) { const hit = ag.some(a => a.name === name); n3.agentMats[name].mats.forEach(m => m.color.set(hit ? C.signal : n3.ac)); }
      if (n3.xtra.textContent !== extra) { n3.xtra.textContent = extra; n3.xtra.hidden = !extra; }
    }
    for (const id of Object.keys(flows3)) flows3[id].mats.forEach(x => x.m.color.set(partOn(f, id, x.src) ? "#ffffff" : flows3[id].ac));
    measure();
  }

  let running = false, tPrev = 0, clock = 0;
  function frame(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - tPrev) / 1000 || 0);
    tPrev = t;
    if (orb.auto && !reduced()) { orb.sway += dt; orb.th = orb.th0 + Math.sin(orb.sway * 0.26) * (camera.aspect < 1.05 ? 0.14 : 0.3); applyCam(); }
    if (!reduced()) { clock += dt; movers.forEach(m => placeOn(m, (clock * 1.5 / m.total + m.off) % 1)); }
    const xy = tokenXY(G);
    token.visible = !!xy;
    if (xy) token.position.copy(P(xy[0], xy[1], LH + 0.14));
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(frame);
  }
  const ro = new ResizeObserver(() => { if (!host.hidden) resize(); });
  ro.observe(host);
  $("#hint3").textContent = window.matchMedia("(pointer: coarse)").matches
    ? "Drag to orbit. Pinch to zoom. Two fingers to pan."
    : "Drag to orbit. Scroll to zoom. Right-drag or shift-drag to pan.";
  return {
    show() { resize(); applyFocus3(); if (!running) { running = true; tPrev = performance.now(); requestAnimationFrame(frame); } },
    hide() { running = false; },
    applyFocus: applyFocus3,
    stopAuto,
    reset() { resetView(); }
  };
}

/* =====================================================================
   12. START
   ===================================================================== */
function init() {
  renderHeader(); renderChips(); renderLegend(); renderResults(); updateTourButtons();
  pickLayout();
  new ResizeObserver(() => { if (view === "2d") pickLayout(); }).observe($("#stage"));

  $("#b2d").addEventListener("click", () => setView("2d"));
  $("#b3d").addEventListener("click", () => setView("3d"));
  $("#bPng").addEventListener("click", downloadPng);
  $("#bSvg").addEventListener("click", downloadSvg);
  $("#bReset").addEventListener("click", () => { if (V3.api) V3.api.reset(); });
  for (const [id, kind] of [["bEvent", "event"], ["bInc", "incident"]]) {
    const b = $("#" + id);
    b.addEventListener("click", () => { if (b.getAttribute("aria-disabled") === "true") lockMessage(b); else startTour(kind, b); });
  }
  $("#tBack").addEventListener("click", () => goStep(tour.i - 1, true));
  $("#tNext").addEventListener("click", () => goStep(tour.i + 1, true));
  $("#tClose").addEventListener("click", () => stopTour(true));
  $("#tPlay").addEventListener("click", () => {
    if (tour.auto) { tour.auto = false; clearTimeout(tour.timer); syncTourBar(); }
    else { tour.auto = true; goStep(tour.i === tour.steps.length - 1 ? 0 : tour.i + 1, false); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!panel.hidden) { closePanel(true); e.preventDefault(); }
    else if (tour.kind) { stopTour(true); e.preventDefault(); }
  });
  document.addEventListener("visibilitychange", () => { if (V3.api && view === "3d") { if (document.hidden) V3.api.hide(); else V3.api.show(); } });
  /* fetch Three.js once the page is idle, so the 3D toggle is instant and failure is known early */
  if ("requestIdleCallback" in window) requestIdleCallback(init3D, { timeout: 2000 }); else setTimeout(init3D, 600);
}
init();
</script>
